name: Build & Upload to Play Store

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        run: |
          export PATH=$PATH:/home/deployer/flutter/bin
          flutter --version

      - name: Get dependencies
        run: |
          export PATH=$PATH:/home/deployer/flutter/bin
          flutter pub get

      - name: Provide signing key (self-hosted runner, copied from the local project; never in git)
        run: |
          cp /home/deployer/koshyk_app/android/key.properties android/key.properties
          mkdir -p android/keystore
          cp /home/deployer/koshyk_app/android/keystore/upload-keystore.jks android/keystore/
          chmod 600 android/key.properties android/keystore/upload-keystore.jks

      - name: Build release AAB
        run: |
          export PATH=$PATH:/home/deployer/flutter/bin
          export ANDROID_HOME=/home/deployer/android-sdk
          flutter build appbundle --release --flavor prod -t lib/main_prod.dart

      - name: Build arm64 APK (attached to the GitHub Release)
        run: |
          export PATH=$PATH:/home/deployer/flutter/bin
          export ANDROID_HOME=/home/deployer/android-sdk
          flutter build apk --release --flavor prod -t lib/main_prod.dart --target-platform android-arm64 --split-per-abi

      - name: Upload AAB to Play Store (internal track)
        run: |
          python3 /home/deployer/.openclaw/workspace/scripts/play_upload.py \
            --aab build/app/outputs/bundle/prodRelease/app-prod-release.aab \
            --track internal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/prodRelease/app-prod-release.aab
            build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk
          name: "koshyk_app ${{ github.ref_name }}"
          body: |
            🚀 Release ${{ github.ref_name }}

            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing key from workspace
        if: always()
        run: rm -f android/key.properties android/keystore/upload-keystore.jks
