name: Build Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        run: |
          export PATH=$PATH:/home/deployer/flutter/bin
          flutter --version

      - name: Get dependencies
        run: |
          export PATH=$PATH:/home/deployer/flutter/bin
          flutter pub get

      - name: Build debug APK
        run: |
          export PATH=$PATH:/home/deployer/flutter/bin
          export ANDROID_HOME=/home/deployer/android-sdk
          flutter build apk --debug

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-debug.apk
          name: "koshyk_app ${{ github.ref_name }}"
          body: |
            🚀 Debug APK для ${{ github.ref_name }}
            
            Коміт: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify via Telegram
        run: |
          RELEASE_URL="https://github.com/gviacheslav-sketch/koshyk_app/releases/tag/${{ github.ref_name }}"
          APK_URL="https://github.com/gviacheslav-sketch/koshyk_app/releases/download/${{ github.ref_name }}/app-debug.apk"
          MESSAGE="✅ *koshyk\_app ${{ github.ref_name }}* зібрано!%0A%0A📦 [Завантажити APK](${APK_URL})%0A🔗 [Release](${RELEASE_URL})"
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MESSAGE}&parse_mode=Markdown" > /dev/null
