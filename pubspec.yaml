name: koshyk_app
description: "Koshyk - Expense Splitter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Database
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  # State management
  flutter_riverpod: ^2.5.1
  # Navigation
  go_router: ^14.6.2
  # Charts
  fl_chart: ^0.69.0
  # Localisation
  intl: ^0.19.0
  # CSV export / sharing
  share_plus: ^10.1.4
  # Arithmetic expression evaluator
  math_expressions: ^2.6.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
