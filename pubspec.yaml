name: koshyk_app
description: "Koshyk - Expense Splitter App"
publish_to: 'none'

version: 2.0.0-dev.1+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Database
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  # State management
  flutter_riverpod: ^2.5.1
  # Navigation
  go_router: ^14.6.2
  # Charts
  fl_chart: ^0.69.0
  # Localisation
  intl: ^0.20.2
  # CSV export / sharing
  share_plus: ^10.1.4
  # Arithmetic expression evaluator
  math_expressions: ^2.6.0
  # Typography
  google_fonts: ^6.2.1
  # App version info
  package_info_plus: ^8.0.0
  path: ^1.9.1
  drift_flutter: ^0.2.8
  # Update checker
  upgrader: ^11.4.0
  # In-app purchases — disabled for v1.0 (Phase 1: free launch)
  # in_app_purchase: ^3.2.0
  # Preferences persistence
  shared_preferences: ^2.3.0
  # Tutorial overlay
  tutorial_coach_mark: ^1.2.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.png
